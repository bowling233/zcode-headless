[project]
name = "zcode-headless"
version = "0.1.2"
description = "Headless 服务器上的 ZCode 管理工具：登录 / 远控注册 / 启动 / 更新，一条命令到底"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41,<50",
    "pyyaml>=6,<7",
]

[project.scripts]
zcode = "zcode_headless:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zcode_headless"]
